<div class="full-screen-background"></div>

<main class="page-content">
  <header class="main-header">
    <h1>Crea tu cuenta</h1>
  </header>

  <div class="content-area">
    <div class="logo-container">
      <img src="/assets/logo-finanmex.png" alt="Logo FINANMEX" />
    </div>

    <div class="form-card">
      <form
        class="registration-form"
        (ngSubmit)="onSubmit()"
        #registerForm="ngForm"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="nombre">Nombre(s) *</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="formData.nombre"
            placeholder="Ej. Axel Rodrigo"
            required
          />
        </div>

        <div class="form-group">
          <label for="apellidoPaterno">Apellido Paterno *</label>
          <input
            type="text"
            id="apellidoPaterno"
            name="apellidoPaterno"
            [(ngModel)]="formData.apellidoPaterno"
            placeholder="Ej. Campos"
            required
          />
        </div>

        <div class="form-group">
          <label for="apellidoMaterno">Apellido Materno</label>
          <input
            type="text"
            id="apellidoMaterno"
            name="apellidoMaterno"
            [(ngModel)]="formData.apellidoMaterno"
            placeholder="Ej. Suárez"
          />
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="formData.email"
            placeholder="Ej. ejemplo@gmail.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input
            type="tel"
            id="phone"
            name="telefono"
            [(ngModel)]="formData.telefono"
            placeholder="Ej. 5624607646"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="formData.password"
            placeholder="Escribe tu contraseña"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="formData.confirmPassword"
            placeholder="Confirmar tu contraseña"
            required
          />
        </div>

        <div class="form-group">
          <label for="birthDate">Fecha de nacimiento</label>
          <input
            type="date"
            id="birthDate"
            name="nacimiento"
            [(ngModel)]="formData.nacimiento"
          />
        </div>

        <div class="form-group">
          <label for="curp">CURP *</label>
          <input
            type="text"
            id="curp"
            name="curp"
            [(ngModel)]="formData.curp"
            placeholder="Ej. LUSA040110HGHNNLA7"
            required
          />
        </div>

        <p class="documents-info">
          Estos documentos son necesarios para cumplir con la regulación y
          proteger tu cuenta.
        </p>

        <div class="form-group">
          <label for="ine-file">INE *</label>
          <input
            type="file"
            id="ine-file"
            name="ine"
            (change)="onFileChange($event, 'ine')"
            required
          />
        </div>

        <div class="form-group">
          <label for="address-proof">Comprobante de domicilio *</label>
          <input
            type="file"
            id="address-proof"
            name="domicilio"
            (change)="onFileChange($event, 'domicilio')"
            required
          />
        </div>

        <p class="file-info">
          Sube tu INE por ambos lados. Formatos permitidos: PDF, JPG, PNG.
          Tamaño máx. 5MB.
        </p>

        <div class="submit-button-container">
            <button type="submit" class="submit-btn-form">Crear cuenta</button>
        </div>
        
      </form>
    </div>
  </div>

  <footer class="page-footer">
    <div class="login-redirect">
      <p>¿Ya tienes una cuenta?</p>
      <a href="/login">[Inicia sesión]</a>
    </div>
  </footer>
</main>
